#flow: Shared _Login
#intent: log in with a test account and land on Home.
# Needs a pre-created account with stats and a pet:
#   maestro test -e MAESTRO_APP_ID=com.hydrohype -e TEST_EMAIL=... -e TEST_PASSWORD=... .maestro/flows
appId: ${MAESTRO_APP_ID}
---
- assertVisible: "Email"
- tapOn: "Enter your email address"
- inputText: ${TEST_EMAIL}
- tapOn: "Enter your password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-button"
- assertVisible: "Today's Progress"
